settings:
  engine_version: "1.21.11-Universal"
  default_rank: "member"

ranks:
  owner:
    prefix: "<gradient:#ff416c:#ff4b2b><b>[OWNER]</b></gradient> "
    weight: 100
    permissions:
      - "*"

  admin:
    prefix: "<gradient:#f12711:#f5af19><b>[ADMIN]</b></gradient> "
    weight: 80
    permissions:
      - "aquastaff.*"
      - "aquasecurity.*"
      - "aquavip.admin"

  # ----------------------------------------------------------------------------
  # 5 Server Ranks (Artwork Matching)
  # ----------------------------------------------------------------------------
  elite:
    glyph: "\uE005"
    prefix: "\uE005 <#A855F7><b>⚡ ‹[ELITE]› ⚡</b></#A855F7> "
    weight: 60
    permissions:
      - "aquavip.perk.*"
      - "aquachat.color"
      - "aquapass.premium"

  mvp_plus:
    glyph: "\uE004"
    prefix: "\uE004 <#FFAA00><b>⭐ [MVP</b><#FF3333><b>+</b></#FF3333><b>] ⭐</b></#FFAA00> "
    weight: 50
    permissions:
      - "aquavip.perk.*"
      - "aquachat.color"
      - "aquapass.premium"

  mvp:
    glyph: "\uE003"
    prefix: "\uE003 <#38BDF8><b>❄ [MVP] ❄</b></#38BDF8> "
    weight: 40
    permissions:
      - "aquavip.perk.*"
      - "aquachat.color"
      - "aquapass.premium"

  vip_plus:
