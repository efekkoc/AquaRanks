      - "aquavip.perk.fly"
      - "aquavip.perk.feed"
      - "aquavip.perk.craft"
      - "aquavip.perk.anvil"
      - "aquavip.perk.enderchest"
      - "aquavip.perk.hat"
      - "aquachat.color"

  vip:
